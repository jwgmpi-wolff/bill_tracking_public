name: medbill-ci-cd

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RG_NAME: rg-medbill-tracker
  LOCATION: eastus
  APP_NAME: app-medbill-api
  RELEASE_CONTAINER: releases
  DOWNLOAD_METADATA_BLOB: release.json

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and Build API
        run: |
          cd backend/MedBill.Api
          dotnet restore
          dotnet build --configuration Release --no-restore

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore

      - name: Build Android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon clean test assembleRelease bundleRelease

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: medbill-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: medbill-aab
          path: android/app/build/outputs/bundle/release/*.aab

  deploy-azure:
    needs: [backend-build, android-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        run: |
          az group create --name $RG_NAME --location $LOCATION
          az deployment group create \
            --resource-group $RG_NAME \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.json \
            --parameters sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }}

      - name: Deploy backend to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: backend/MedBill.Api

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload signed APK/AAB to blob release container
        env:
          STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT_NAME }}
        run: |
          VERSION=$(date +"%Y.%m.%d.%H%M")
          APK_PATH=$(ls artifacts/medbill-apk/*.apk | head -n 1)
          AAB_PATH=$(ls artifacts/medbill-aab/*.aab | head -n 1)
          APK_NAME="MedBillTracker-v${VERSION}.apk"
          AAB_NAME="MedBillTracker-v${VERSION}.aab"

          az storage blob upload \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$RELEASE_CONTAINER" \
            --name "$APK_NAME" \
            --file "$APK_PATH" \
            --overwrite

          az storage blob upload \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$RELEASE_CONTAINER" \
            --name "$AAB_NAME" \
            --file "$AAB_PATH" \
            --overwrite

          APK_SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          EXPIRES_AT=$(date -u -d "+7 days" +"%Y-%m-%dT%H:%MZ")
          SAS_TOKEN=$(az storage blob generate-sas \
            --auth-mode login \
            --as-user \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$RELEASE_CONTAINER" \
            --name "$APK_NAME" \
            --permissions r \
            --https-only \
            --expiry "$EXPIRES_AT" \
            --output tsv)

          DOWNLOAD_URL="https://${STORAGE_ACCOUNT}.blob.core.windows.net/${RELEASE_CONTAINER}/${APK_NAME}?${SAS_TOKEN}"

          cat > release.json <<EOF
          {"version":"v${VERSION}","releaseDate":"$(date -u +%FT%TZ)","fileName":"${APK_NAME}","aabFileName":"${AAB_NAME}","sha256":"${APK_SHA256}","downloadUrl":"${DOWNLOAD_URL}"}
          EOF

      - name: Update release metadata JSON
        env:
          STORAGE_ACCOUNT: ${{ secrets.STORAGE_ACCOUNT_NAME }}
        run: |
          az storage blob upload \
            --auth-mode login \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name web \
            --name "$DOWNLOAD_METADATA_BLOB" \
            --file release.json \
            --overwrite
